name: "Pruebas automatizadas — RF-03 Bloqueo de interfaz local"

on:
  push:
  pull_request:
    paths:
      - "src/capture_context.py"
      - "tests/test_rf03_capture_context.py"
      - "docs/pruebas/RF-03.md"
      - ".github/workflows/pruebas-rf-03.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-rf-03:
    name: Verificación automatizada RF-03
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar pruebas RF-03
        run: python -m unittest discover -s tests -p 'test_rf03*.py' -v
      - name: Registrar resultado en el resumen
        if: always()
        run: |
          echo "### RF-03 — Bloqueo de interfaz local" >> "$GITHUB_STEP_SUMMARY"
          echo "Categorías: unitaria, integración, funcional, rendimiento/estrés y aceptación automatizada." >> "$GITHUB_STEP_SUMMARY"
          echo "Resultado del trabajo: **${{ job.status }}**" >> "$GITHUB_STEP_SUMMARY"
