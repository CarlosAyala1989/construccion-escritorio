name: "Pruebas automatizadas — RF-08 Bandeja de pendientes"

on:
  push:
  pull_request:
    paths:
      - "src/core/pending_tray.py"
      - "tests/test_rf08_pending_tray.py"
      - "docs/pruebas/RF-08.md"
      - ".github/workflows/pruebas-rf-08.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-rf-08:
    name: Verificación automatizada RF-08
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar pruebas RF-08
        run: python -m unittest discover -s tests -p 'test_rf08*.py' -v
      - name: Registrar resultado en el resumen
        if: always()
        run: |
          echo "### RF-08 — Derivación a bandeja de pendientes" >> "$GITHUB_STEP_SUMMARY"
          echo "Categorías: unitaria, integración, funcional, rendimiento/estrés y aceptación automatizada." >> "$GITHUB_STEP_SUMMARY"
          echo "Resultado del trabajo: **${{ job.status }}**" >> "$GITHUB_STEP_SUMMARY"
